<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Чек-лист для путешествий: вещи под погоду, срок и тип поездки.">
<style>[hidden]{display:none!important}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>В дорогу</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Раскладка: одна колонка 560px. Сверху форма в виде посадочного талона с перфорацией, ниже погода,
   затем липкая полоса прогресса и список: сначала жёлтый блок «В первую очередь», потом категории. */
:root{
  --bg:#E9F0F2; --surface:#FFFFFF; --surface-2:#F2F6F8; --ink:#0F2430; --muted:#587080; --line:#D2DEE3;
  --accent:#0A6C78; --on-accent:#FFFFFF; --tag:#F5B83D; --on-tag:#2B1F00; --ok:#1F8A55;
  --display:'Unbounded','Montserrat',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1820; --surface:#13252E; --surface-2:#1A303B; --ink:#E7F1F4; --muted:#8FA6B1; --line:#27414D;
    --accent:#46C2CF; --on-accent:#04232A; --tag:#F5B83D; --on-tag:#2B1F00; --ok:#5CCB8D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1820; --surface:#13252E; --surface-2:#1A303B; --ink:#E7F1F4; --muted:#8FA6B1; --line:#27414D;
  --accent:#46C2CF; --on-accent:#04232A; --tag:#F5B83D; --on-tag:#2B1F00; --ok:#5CCB8D; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);padding-inline:16px;padding-block:20px 56px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mono,.lab,.meta,.code,.pill,.info dt{font-family:var(--mono)}

.head{display:flex;flex-direction:column;gap:6px;padding-top:4px}
h1{margin:0;font:600 24px/1.15 var(--display);text-wrap:balance;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:46ch}

.lab{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* форма-талон */
.pass{background:var(--surface);border:1px solid var(--line);border-radius:22px;position:relative;overflow:hidden}
.pass-top{padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.dest-row{display:flex;align-items:flex-end;gap:12px}
#dest{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;color:var(--ink);
  font:600 26px/1.2 var(--display);padding:4px 0 8px;outline:0;letter-spacing:-.01em}
#dest::placeholder{color:var(--muted);opacity:.55}
#dest:focus{border-bottom-color:var(--accent)}
.code{flex:none;font-size:24px;font-weight:600;color:var(--accent);padding-bottom:10px;letter-spacing:.06em}
.quick,.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:500 14px/1 var(--body);
  padding:11px 14px;min-height:40px;border-radius:999px;transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.q{padding:9px 12px;min-height:36px;font-size:13px;color:var(--muted)}
.chip:focus-visible,.step button:focus-visible,select:focus-visible,#addIn:focus-visible,.link:focus-visible,.del:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{margin:0;font-size:14px;color:var(--muted)}
.climate{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--surface-2);border-radius:14px}

.perf{position:relative;margin:0 18px;border-top:2px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-29px}
.perf::after{right:-29px}
.pass-bot{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{min-width:0}
.field.wide{grid-column:1 / -1}
select{width:100%;font:500 16px/1.2 var(--body);padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);min-height:48px}
.step{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;min-height:48px;padding:3px}
.step button{width:42px;height:42px;border:0;border-radius:9px;background:var(--surface);color:var(--ink);font:500 22px/1 var(--body);display:grid;place-items:center}
.step output{font:500 15px/1 var(--body);text-align:center;flex:1;white-space:nowrap}

/* погода */
.wx{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.wx-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.wx-l{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.wx-l .lab{margin:0}
.wx-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wx-t b{font:600 34px/1 var(--display);letter-spacing:-.02em}
.wx-t span{font:500 14px/1 var(--mono);color:var(--muted)}
.pill{font-size:11px;font-weight:500;letter-spacing:.06em;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
#wSpark svg{display:block;width:100%;height:auto;max-width:100%}
.sp-area{fill:var(--accent);opacity:.14;stroke:none}
.sp-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.sp-base{fill:none;stroke:var(--line);stroke-width:1}
.sp-dot{fill:var(--tag);stroke:var(--accent);stroke-width:2.5}
.sp-lab{fill:var(--muted);font:500 10px var(--mono)}
.sp-val{fill:var(--ink);font:600 11px var(--mono)}
.adv{margin:0;font-size:15px}
.info{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.info dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.info dd{margin:0;overflow-wrap:anywhere}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.notes:empty{display:none}
.notes li{display:flex;gap:10px;align-items:flex-start}
.notes li::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--tag);color:var(--on-tag);font:700 12px/20px var(--mono);text-align:center}

/* липкая полоса прогресса */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.bar-in{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar-txt{font:500 14px/1.2 var(--body)}
.bar-txt b{font:600 15px var(--mono)}
.chip.sm{padding:8px 12px;min-height:34px;font-size:13px}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}

/* список */
.list{display:flex;flex-direction:column;gap:14px}
.sec,.prio{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.prio{border-color:var(--tag)}
.prio-head{background:var(--tag);color:var(--on-tag);display:flex;align-items:center;gap:12px;padding:14px 16px}
.hole{flex:none;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--on-tag);opacity:.9}
.prio-head h2,.sec summary h2{margin:0;font:600 15px/1.2 var(--display);letter-spacing:-.005em}
.prio-head .sub{display:block;font:500 12px/1.3 var(--body);opacity:.8;margin-top:3px}
.cnt{margin-left:auto;font:600 13px/1 var(--mono);white-space:nowrap}
.sec summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;min-height:56px}
.sec summary::-webkit-details-marker{display:none}
.sec summary .sub{display:block;font:500 12px/1.3 var(--body);color:var(--muted);margin-top:3px}
.sec .cnt{color:var(--muted)}
.sec.full .cnt{color:var(--ok)}
.chev{flex:none;width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-left:4px;transition:transform .2s;margin-bottom:3px}
.sec[open] .chev{transform:rotate(-135deg);margin-bottom:-3px}

.item{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.lbl{position:relative;flex:1;min-width:0;display:flex;gap:14px;align-items:flex-start;padding:13px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lbl input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.info:empty{display:none}
.box{flex:none;width:26px;height:26px;margin-top:1px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box::after{content:"";width:6px;height:12px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item.done .box::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.lbl input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:500;overflow-wrap:anywhere}
.nt{font-size:13px;color:var(--muted);line-height:1.35}
.meta{font-size:10px;font-weight:500;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.item.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.item.done .nt{opacity:.7}
.hide-done .item.done{display:none}
.del{flex:none;align-self:center;border:0;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:10px;font-size:22px;line-height:1;margin-right:6px}

.add{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
#addIn{flex:1;min-width:0;font:400 16px/1.2 var(--body);padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);min-height:48px}
.btn{border:0;background:var(--accent);color:var(--on-accent);font:600 15px/1 var(--body);padding:0 16px;border-radius:12px;min-height:48px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px/1.3 var(--display);margin-bottom:6px}
.done-msg{margin:0;text-align:center;font:600 14px var(--body);color:var(--ok)}

.foot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;color:var(--muted)}
.foot p{margin:0}
.link{border:0;background:transparent;color:var(--accent);font:600 14px var(--body);padding:10px 14px;min-height:44px;border-radius:10px;text-decoration:underline;text-underline-offset:3px}

@media (max-width:380px){
  .wx-main{grid-template-columns:1fr}
  #dest{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="app">
  <header class="head">
    <h1>Что взять с собой</h1>
    <p class="lead">Введите место и параметры поездки. Список подстроится под погоду, срок и тип поездки.</p>
  </header>

  <section class="pass" aria-label="Параметры поездки">
    <div class="pass-top">
      <div>
        <label class="lab" for="dest">Куда</label>
        <div class="dest-row">
          <input id="dest" type="text" list="places" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Турция, Алматы, Париж" enterkeyhint="done">
          <span class="code" id="code" title="Код аэропорта">---</span>
        </div>
        <datalist id="places"></datalist>
      </div>
      <div class="quick" id="quick" aria-label="Популярные направления"></div>
      <div class="climate" id="climateBox" hidden>
        <p class="hint" id="climateHint"></p>
        <div class="row" id="climateChips" role="group" aria-label="Климат"></div>
      </div>
    </div>
    <div class="perf" aria-hidden="true"></div>
    <div class="pass-bot">
      <div class="field">
        <label class="lab" for="month">Месяц</label>
        <select id="month"></select>
      </div>
      <div class="field">
        <span class="lab" id="daysLab">Длительность</span>
        <div class="step" role="group" aria-labelledby="daysLab">
          <button type="button" id="dMinus" aria-label="Меньше дней">−</button>
          <output id="daysOut" aria-live="polite">7 дней</output>
          <button type="button" id="dPlus" aria-label="Больше дней">+</button>
        </div>
      </div>
      <div class="field wide">
        <span class="lab" id="typeLab">Тип поездки</span>
        <div class="row" id="types" role="group" aria-labelledby="typeLab"></div>
      </div>
    </div>
  </section>

  <section class="wx" id="wx" aria-label="Погода и условия" hidden>
    <div class="wx-main">
      <div class="wx-l">
        <span class="lab" id="wMonth"></span>
        <div class="wx-t"><b id="wHi"></b><span id="wLo"></span></div>
        <span class="pill" id="wRain"></span>
      </div>
      <div id="wSpark"></div>
    </div>
    <p class="adv" id="wAdv"></p>
    <dl class="info" id="wInfo"></dl>
    <ul class="notes" id="wNotes"></ul>
  </section>

  <div class="bar" id="bar" hidden>
    <div class="bar-in">
      <div class="bar-top">
        <span class="bar-txt" id="barTxt"></span>
        <button type="button" class="chip sm" id="hideDone" aria-pressed="false">Скрыть собранное</button>
      </div>
      <div class="track" role="progressbar" aria-label="Собрано вещей" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track"><i id="fill"></i></div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <footer class="foot" id="foot" hidden>
    <p>Отметки хранятся на этом устройстве.</p>
    <button type="button" class="link" id="reset">Сбросить отметки</button>
  </footer>
</main>

  var n=norm(q),i,j,a;
  if(n.length<2)return null;

  if(beach&&w.hi>=24)A('hyg','spf','Солнцезащитный крем SPF 30–50',1,'Наносите заново каждые 2 часа и после купания');
  else if(sun)A('hyg','spf','Солнцезащитный крем',2,(hike||ski)?'В горах ультрафиолета больше':'');
  if(cold||ski)A('hyg','lip','Крем для рук и гигиеническая помада',2,'Ветер и мороз сушат кожу');

/* Погода: текст, заметки, график */
function advice(w){
  var a,hi=w.hi;
  if(hi>=32)a='Очень жарко.';else if(hi>=28)a='Жарко.';else if(hi>=22)a='Тепло.';else if(hi>=16)a='Мягкая погода.';else if(hi>=8)a='Прохладно.';else if(hi>=0)a='Холодно.';else a='Мороз.';
  if(hi>=22)a+=' Нужны лёгкие вещи'+(w.rain<=1?' и защита от солнца.':'.');
  else if(hi>=16)a+=' Лучше одеваться слоями: днём футболка, вечером кофта.';
  else if(hi>=8)a+=' Нужны куртка и закрытая обувь.';
  else a+=' Нужна тёплая одежда по слоям.';
  if(w.rain>=2)a+=' Часто идут дожди.';else if(w.rain===1)a+=' Возможны дожди.';
  if(hi-w.lo>=12&&w.lo<=14)a+=' Вечером заметно прохладнее.';
  return a;
}
function notes(){
  var w=S.w,m=S.month,N=[],T={};
  S.types.forEach(function(t){T[t]=1});
  if(T.ski&&w.hi>10)N.push('В '+MON_PREP[m]+' для лыж обычно слишком тепло (днём '+temp(w.hi)+'). Лыжные вещи в список не добавлены.');
  if(T.beach&&w.hi<18)N.push('В '+MON_PREP[m]+' для купания прохладно: днём около '+temp(w.hi)+'. Купальник оставлен по желанию.');
  if(T.hike&&w.rain>=2)N.push('В это время часто идут дожди, тропы скользкие. Нужны обувь с протектором и дождевик.');
  if(S.days<=3)N.push('Короткая поездка: всё поместится в ручную кладь, список сокращён.');
  if(S.days>=14)N.push('Долгая поездка: берите вещи на 7 дней и стирайте в пути.');
  return N;
}
function spark(arr,m){
  var W=260,H=76,pl=8,pr=8,pt=18,pb=20,mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rg=Math.max(mx-mn,8),k,line='',labs='';
  var x=function(i){return pl+i*(W-pl-pr)/11},y=function(v){return pt+(H-pt-pb)*(1-(v-mn)/rg)};
  for(k=0;k<12;k++)line+=(k?'L':'M')+x(k).toFixed(1)+' '+y(arr[k]).toFixed(1);
  var area=line+'L'+x(11).toFixed(1)+' '+(H-pb)+'L'+x(0).toFixed(1)+' '+(H-pb)+'Z';
  [0,3,6,9,11].forEach(function(j){labs+='<text class="sp-lab" x="'+x(j).toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+(j===0?'start':j===11?'end':'middle')+'">'+MON_SHORT[j]+'</text>'});
  var dx=x(m),dy=y(arr[m]),tx=Math.min(Math.max(dx,22),W-22);
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Средняя дневная температура по месяцам, выбран '+MONTHS[m]+'">'+
    '<path class="sp-area" d="'+area+'"/><path class="sp-base" d="M'+pl+' '+(H-pb)+'H'+(W-pr)+'"/><path class="sp-line" d="'+line+'"/>'+
    '<circle class="sp-dot" cx="'+dx.toFixed(1)+'" cy="'+dy.toFixed(1)+'" r="5"/>'+
    '<text class="sp-val" x="'+tx.toFixed(1)+'" y="'+Math.max(dy-10,10).toFixed(1)+'" text-anchor="middle">'+temp(arr[m])+'</text>'+labs+'</svg>';
}

/* Отрисовка формы и погоды */
function paintPass(){
  $('#code').textContent=S.cur?S.cur.code:'---';
  $('#month').value=String(S.month);
  $('#daysOut').textContent=S.days+' '+plural(S.days,'день','дня','дней');
  $$('#types .chip').forEach(function(b){b.setAttribute('aria-pressed',S.types.indexOf(b.dataset.t)>=0?'true':'false')});
  $$('#quick .chip').forEach(function(b){b.setAttribute('aria-pressed',S.cur&&S.cur.id===b.dataset.q?'true':'false')});
  var unknown=norm(S.dest).length>0&&!S.cur;
  $('#climateBox').hidden=!unknown;
  if(unknown)$('#climateHint').textContent='Места «'+S.dest.trim()+'» пока нет в базе. Выберите климат, и погода будет оценена по похожему региону.';
  $$('#climateChips .chip').forEach(function(b){b.setAttribute('aria-pressed',S.climate===b.dataset.k?'true':'false')});
}
function paintWx(){
  var box=$('#wx'),w=S.w,m=S.month;
  if(!norm(S.dest)){box.hidden=true;return}
  box.hidden=false;
  var season=TROPIC_IDS[w.ref.id]?(w.rain>=2?'сезон дождей':'сухой сезон'):SEASON[m].toLowerCase();
  $('#wMonth').textContent=MONTHS[m]+' · '+season+(S.cur?'':' · ориентировочно');
  $('#wHi').textContent=temp(w.hi);
  $('#wLo').textContent='ночью '+temp(w.lo);
  $('#wRain').textContent=['Осадки редко','Возможны дожди','Часто идут дожди'][w.rain];
  $('#wAdv').textContent=advice(w);
  $('#wSpark').innerHTML=spark(w.ref.hi,m);
  var info='';
  if(S.cur){
    info+='<dt>Розетки</dt><dd>'+esc(S.cur.plug)+'</dd><dt>Валюта</dt><dd>'+esc(S.cur.cur)+'</dd>';
    if(S.cur.entry)info+='<dt>Въезд</dt><dd>'+esc(S.cur.entry)+'</dd>';
  }
  $('#wInfo').innerHTML=info;
  $('#wNotes').innerHTML=notes().map(function(t){return '<li>'+esc(t)+'</li>'}).join('');
}

/* Список */
function itemHtml(x,done,meta,del){
  return '<div class="item'+(done?' done':'')+'" data-id="'+esc(x.id)+'"><label class="lbl"><input type="checkbox"'+(done?' checked':'')+'><span class="box" aria-hidden="true"></span><span class="tx"><span class="nm">'+esc(x.name)+'</span>'+
    (x.note?'<span class="nt">'+esc(x.note)+'</span>':'')+(meta?'<span class="meta">'+esc(meta)+'</span>':'')+'</span></label>'+
    (del?'<button type="button" class="del" data-del="'+esc(x.id)+'" aria-label="Удалить: '+esc(x.name)+'">×</button>':'')+'</div>';
}
function section(id,title,sub,body){
  return '<details class="sec" data-sec="'+id+'"'+(S.collapsed[id]?'':' open')+'><summary><div style="min-width:0"><h2>'+esc(title)+'</h2>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</div><span class="cnt"></span><span class="chev" aria-hidden="true"></span></summary>'+body+'</details>';
}
function renderList(){
  var box=$('#list');
  if(!norm(S.dest)){
    box.innerHTML='<div class="empty"><b>Куда едем?</b>Введите место или выберите направление выше, и здесь появится список вещей.</div>';
    $('#bar').hidden=true;$('#foot').hidden=true;return;
  }
  var items=build(),key=tripKey(),ck=S.checks[key]||{},html='';
  var catIdx={};CATS.forEach(function(c,i){catIdx[c[0]]=i});
  var catName={};CATS.forEach(function(c){catName[c[0]]=c[2]});
  var first=items.filter(function(x){return x.prio===1}).sort(function(a,b){return catIdx[a.cat]-catIdx[b.cat]||a.o-b.o});
  html+='<div class="prio" data-sec="prio"><div class="prio-head"><span class="hole" aria-hidden="true"></span><div><h2>В первую очередь</h2><span class="sub">Без этого лучше не выезжать</span></div><span class="cnt"></span></div>'+
    first.map(function(x){return itemHtml(x,!!ck[x.id],catName[x.cat],false)}).join('')+'</div>';
  CATS.forEach(function(c){
    var rest=items.filter(function(x){return x.cat===c[0]&&x.prio>1}).sort(function(a,b){return a.prio-b.prio||a.o-b.o});
    if(!rest.length)return;
    var sub='';
    if(c[0]==='loc'){
      var tl=TYPES.filter(function(t){return S.types.indexOf(t[0])>=0}).map(function(t){return t[1]}).join(', ');
      sub=(S.cur?S.cur.title:S.dest.trim())+' · '+tl;
    }
    html+=section(c[0],c[1],sub,rest.map(function(x){return itemHtml(x,!!ck[x.id],x.prio===3?'по желанию':'',false)}).join(''));
  });
  var own=S.custom[key]||[];
  html+=section('own','Своё','Добавьте то, чего нет в списке',
    own.map(function(x){return itemHtml({id:x.id,name:x.name,note:''},!!ck[x.id],'',true)}).join('')+
    '<div class="add"><input id="addIn" type="text" maxlength="80" placeholder="Например, плед" autocomplete="off" enterkeyhint="done" aria-label="Своя вещь"><button type="button" class="btn" id="addBtn">Добавить</button></div>');
  box.innerHTML=html;
  box.classList.toggle('hide-done',S.hideDone);
  $('#bar').hidden=false;$('#foot').hidden=false;
  updateCounts();
}
function updateCounts(){
  var all=$$('#list .item'),done=$$('#list .item.done'),pct=all.length?Math.round(done.length/all.length*100):0;
  $('#fill').style.width=pct+'%';
  $('#track').setAttribute('aria-valuenow',String(pct));
  $('#barTxt').innerHTML=(all.length&&done.length===all.length)?'Чемодан собран. Хорошей дороги!':'<b>'+done.length+'</b> из '+all.length+' собрано';
  $$('#list [data-sec]').forEach(function(s){
    var t=$$('.item',s).length,k=$$('.item.done',s).length,cnt=$('.cnt',s);
    cnt.textContent=t?k+'/'+t:'';
    s.classList.toggle('full',t>0&&k===t);
  });
}
function update(){
  S.w=weather();
  paintPass();paintWx();renderList();save();
}
function onDest(){
  var prev=S.lastId;
  S.cur=resolve(S.dest);
  var id=S.cur?S.cur.id:null;
  if(S.cur&&id!==prev)S.types=S.cur.types.slice();
  S.lastId=id;
  update();
}

/* Первичная сборка интерфейса и события */
function init(){
  load();
  S.cur=resolve(S.dest);S.lastId=S.cur?S.cur.id:null;
  $('#month').innerHTML=MONTHS.map(function(n,i){return '<option value="'+i+'">'+n+'</option>'}).join('');
  $('#types').innerHTML=TYPES.map(function(t){return '<button type="button" class="chip" data-t="'+t[0]+'" aria-pressed="false">'+t[1]+'</button>'}).join('');
  $('#quick').innerHTML=['tr','ala','fr','ae','th','eg','ist','bali'].map(function(id){return '<button type="button" class="chip q" data-q="'+id+'" aria-pressed="false">'+byId(id).title+'</button>'}).join('');
  $('#climateChips').innerHTML=CLIMATES.map(function(c){return '<button type="button" class="chip" data-k="'+c[0]+'" aria-pressed="false">'+c[1]+'</button>'}).join('');
  $('#places').innerHTML=D.map(function(d){return '<option value="'+esc(d.title)+'"></option>'}).join('');
  $('#dest').value=S.dest;
  $('#hideDone').setAttribute('aria-pressed',S.hideDone?'true':'false');

  $('#dest').addEventListener('input',function(){S.dest=this.value;onDest()});
  $('#quick').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    S.dest=byId(b.dataset.q).title;$('#dest').value=S.dest;onDest();
  });
  $('#month').addEventListener('change',function(){S.month=+this.value;update()});
  $('#dMinus').addEventListener('click',function(){S.days=Math.max(1,S.days-1);update()});
  $('#dPlus').addEventListener('click',function(){S.days=Math.min(60,S.days+1);update()});
  $('#types').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    var t=b.dataset.t,ix=S.types.indexOf(t);
    if(ix>=0){if(S.types.length>1)S.types.splice(ix,1)}else S.types.push(t);
    update();
  });
  $('#climateChips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    S.climate=b.dataset.k;update();
  });
  $('#hideDone').addEventListener('click',function(){
    S.hideDone=!S.hideDone;
    this.setAttribute('aria-pressed',S.hideDone?'true':'false');
    $('#list').classList.toggle('hide-done',S.hideDone);
    save();
  });
  var list=$('#list');
  list.addEventListener('change',function(e){
    var it=e.target.closest('.item');if(!it||e.target.type!=='checkbox')return;
    var key=tripKey(),ck=(S.checks[key]=S.checks[key]||{}),id=it.dataset.id;
    if(e.target.checked)ck[id]=1;else delete ck[id];
    it.classList.toggle('done',e.target.checked);
    updateCounts();save();
  });
  list.addEventListener('click',function(e){
    var del=e.target.closest('[data-del]');
    if(del){
      var key=tripKey(),id=del.dataset.del;
      S.custom[key]=(S.custom[key]||[]).filter(function(x){return x.id!==id});
      if(S.checks[key])delete S.checks[key][id];
      save();renderList();return;
    }
    if(e.target.closest('#addBtn'))addOwn();
  });
  list.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.id==='addIn'){e.preventDefault();addOwn()}
  });
  list.addEventListener('toggle',function(e){
    var s=e.target;if(s.dataset&&s.dataset.sec)S.collapsed[s.dataset.sec]=!s.open;
  },true);
  var resetBtn=$('#reset'),resetT=0;
  resetBtn.addEventListener('click',function(){
    if(!resetT){
      resetBtn.textContent='Точно сбросить все отметки?';
      resetT=setTimeout(function(){resetT=0;resetBtn.textContent='Сбросить отметки'},4000);
      return;
    }
    clearTimeout(resetT);resetT=0;resetBtn.textContent='Сбросить отметки';
    S.checks[tripKey()]={};save();renderList();
  });
  update();
}
function addOwn(){
  var inp=$('#addIn'),v=inp?inp.value.trim():'';
  if(!v)return;
  var k=tripKey();
  (S.custom[k]=S.custom[k]||[]).push({id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),name:v.slice(0,80)});
  save();renderList();
  var n=$('#addIn');if(n)n.focus();
}
init();
</script>
